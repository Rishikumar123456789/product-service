server:
  port: 8082

spring:
  application:
    name: product-service
  config:
    import: "configserver:http://config-server:8888"
  cloud:
    config:
      label: main

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
